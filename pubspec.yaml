name: silly_soup
description: "Silly Soup - a Letters and Sounds Phase One alliteration game for EYFS"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # State management
  provider: ^6.1.5+1

  # Local storage for adult settings
  shared_preferences: ^2.5.5

  # SVG rendering (logo, ingredient artwork)
  flutter_svg: ^2.3.0

  # Recorded phoneme and word clips
  audioplayers: ^6.8.1

  # Speech fallback when a clip is missing (Web Speech API on web)
  flutter_tts: ^4.2.5

  # Live-only mirror for "Watch my mouth" — never records
  camera: ^0.12.1

  # Utilities
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/audio/phonemes/
    - assets/audio/words/
    - assets/audio/song/
    # Only the licence: the .ttf files are declared under `fonts:` below, and
    # listing the directory here as well would bundle all three a second time.
    - assets/google_fonts/OFL.txt
    - assets/kindling_logo.svg

  # Poppins, bundled. It used to be loaded through the google_fonts package,
  # which carries a generated table of every family Google publishes in order
  # to look one of them up — dead weight in a bundle that a nursery tablet has
  # to download before it can play. Declaring the family here is what the
  # package was doing anyway, minus the table and minus the dependency.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/google_fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Poppins-SemiBold.ttf
          weight: 600
