name: silly_soup
description: "Silly Soup - a Letters and Sounds Phase One alliteration game for EYFS"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

# `flutter pub get` finishes with "2 packages have newer versions incompatible
# with dependency constraints", naming material_color_utilities and test_api.
# Neither is ours to move: the Flutter SDK pins both to an exact version because
# the framework and flutter_test reach into their internals —
#   material_color_utilities  packages/flutter/pubspec.yaml       flutter#185017
#   test_api                  packages/flutter_test/pubspec.yaml  flutter#185016
# A dependency_overrides entry only trades that line for a permanent
# "(overridden)" one and puts us outside the SDK's tested set, so leave them be;
# they clear when Flutter bumps its own pins. Everything we declare here is at
# its latest published version.
dependencies:
  flutter:
    sdk: flutter

  # Typography. Poppins is bundled under assets/google_fonts so the app never
  # reaches fonts.gstatic.com at runtime — see PRIVACY.md.
  google_fonts: ^8.2.1

  # State management
  provider: ^6.1.5+1

  # Local storage for adult settings
  shared_preferences: ^2.5.5

  # SVG rendering (logo, ingredient artwork)
  flutter_svg: ^2.3.0

  # Recorded phoneme and word clips
  audioplayers: ^6.8.1

  # Speech fallback when a clip is missing, on iOS, Android and desktop.
  # The web uses the Web Speech API directly — see speech_engine_web.dart.
  flutter_tts: ^4.2.5

  # Web Speech API bindings for the browser voice
  web: ^1.1.1

  # Live-only mirror for "Watch my mouth" — never records
  camera: ^0.12.1

  # Utilities
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/audio/manifest.json
    - assets/audio/phonemes/
    - assets/audio/words/
    - assets/audio/commentary/
    - assets/audio/list/
    - assets/audio/lines/
    - assets/audio/actions/
    - assets/audio/song/
    - assets/google_fonts/
    - assets/kindling_logo.svg
