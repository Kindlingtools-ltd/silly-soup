# Cloudflare Pages configuration.
#
# silly-soup.kindlingtools.com is a custom domain on the Pages project
# `silly-soup`, the same arrangement as ks1-phonics and ks1-mtc. Deploying to
# a Cloudflare *Worker* of the same name instead publishes to a resource the
# domain does not point at — the two are separate things.
name = "silly-soup"
compatibility_date = "2026-09-23"
pages_build_output_dir = "build/web"
