# Cloudflare Worker with static assets.
#
# silly-soup.kindlingtools.com is bound to the Worker named `silly-soup`, so
# the app ships as that Worker's assets. Deploying it as a Cloudflare Pages
# project instead creates a second, separate resource with the same name that
# the custom domain does not point at — which is what left the domain serving
# the placeholder "Hello World".
name = "silly-soup"
compatibility_date = "2026-09-23"

[assets]
directory = "build/web"
# Flutter web is a single-page app: any path the bundle does not contain is
# still the app, not a 404.
not_found_handling = "single-page-application"
