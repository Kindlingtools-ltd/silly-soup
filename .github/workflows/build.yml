name: Build & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A second push to the same branch makes the first one irrelevant. Keep
# master deploys serialised, though — cancelling one mid-upload would leave
# Pages serving a half-published build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse code
        # Infos are failures here: analysis_options.yaml is the house style,
        # and a rule nobody has to obey is not a rule.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Check for unused or missing dependencies
        run: flutter pub deps --style=compact

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  web-tests:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # The service worker and the update flow in web/ decide which build a
      # nursery is running, and `flutter test` cannot see either of them.
      # No dependencies: the harness is the runtime's own fetch and Response.
      - name: Run web tests
        run: bun test test/web

  audio-checklist:
    name: Audio checklist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Exits non-zero while clips are outstanding, which is the normal state
      # until the recordings are made. Reported, not enforced — the app falls
      # back to the device voice and logs what is missing.
      - name: List outstanding recordings
        continue-on-error: true
        run: dart run tool/audio_checklist.dart

  build-web:
    name: Build & Deploy Web
    needs: [lint, test, web-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web (WASM)
        # BUILD_ID is what the adult area shows, so a grown-up can say out
        # loud which build a tablet is on.
        run: |
          flutter build web --wasm --release --base-href "/" \
            --dart-define=BUILD_ID="${GITHUB_SHA}"

      # The service worker's cache is named after the build, and its own bytes
      # change with it — which is the only reason a browser notices a deploy at
      # all. An unstamped worker would give every build one shared cache and
      # never update, so treat a stamp that did not land as a failed build
      # rather than a quiet one.
      - name: Stamp the service worker build id
        run: |
          sed -i "s/__BUILD_ID__/${GITHUB_SHA}/g" build/web/sw.js
          if grep -q "__BUILD_ID__" build/web/sw.js; then
            echo "::error title=Service worker not stamped::build/web/sw.js still contains __BUILD_ID__, so every build would share one cache."
            exit 1
          fi
          echo "Service worker stamped with ${GITHUB_SHA}."

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web
          retention-days: 7

      - name: Setup Bun
        if: github.event_name != 'pull_request'
        uses: oven-sh/setup-bun@v2

      - name: Install Wrangler
        if: github.event_name != 'pull_request'
        run: bun add -g wrangler

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to publish the app."
            exit 0
          fi
          # silly-soup.kindlingtools.com is a custom domain on the Pages
          # project, not on a Worker of the same name. See wrangler.toml.
          wrangler pages project create silly-soup --production-branch=master || true
          wrangler pages deploy build/web --project-name=silly-soup --branch=master --commit-dirty=true

  build-android:
    name: Build Android
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: false  # Web first; enable when the app goes to the Play Store.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS
    needs: [lint, test]
    runs-on: macos-latest
    if: false  # Web first; enable when the app goes to the App Store.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
