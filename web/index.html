    of which is to be the first thing a child sees, was drawn at 37% size on a
    360px phone and 82% on an 800px tablet. Only a screen at least 980px wide
    escaped it, which is why an iPad looked right.

    Same content as the engine's tag, so nothing moves when it takes over.
  -->

  <!--
    The engine is ~2.4MB and, left alone, the browser does not discover it
    until flutter_bootstrap.js has been fetched, parsed and run — the two big
    downloads used to start ~270ms and ~460ms in, on an otherwise idle link.
    Preloading starts them with the first round trip instead.

    Which bundle to warm depends on the browser: a WasmGC engine runs
    main.dart.wasm, everything else falls back to main.dart.js, and preloading
    the wrong one would waste more than it saves. So this does the same
    one-line WasmGC probe flutter.js does, and injects accordingly. Keep the
    probe identical to the loader's or the preload will miss.
  -->
  <script>
    (function () {
      var wasmGC = (function () {
        try {
          return WebAssembly.validate(
            new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
        } catch (e) {
          return false;
        }
      })();
      // The loader reaches the .wasm files with a bare `fetch(url)`, which is
      // mode "cors", credentials "same-origin". A preload only gets reused if
      // it was made the same way, and `as="fetch"` without `crossorigin` is
      // mode "no-cors" — so it misses and the file is fetched twice. Bare
      // `crossorigin` is the anonymous form, which is the pair that matches.
      var warm = wasmGC
        ? ['main.dart.wasm', 'main.dart.mjs', 'canvaskit/skwasm.js', 'canvaskit/skwasm.wasm']
        : ['main.dart.js', 'canvaskit/canvaskit.js', 'canvaskit/canvaskit.wasm'];
      for (var i = 0; i < warm.length; i++) {
        var link = document.createElement('link');
        // main.dart.mjs is pulled in with a dynamic import(), and only
        // `modulepreload` matches that — `preload as=script` is a different
        // request and the browser fetches the file a second time.
        if (/\.mjs$/.test(warm[i])) {
          // Pulled in with import(); only modulepreload matches that.
          link.rel = 'modulepreload';
        } else if (/\.js$/.test(warm[i])) {
          link.rel = 'preload';
          link.as = 'script';
        } else {
          link.rel = 'preload';
          link.as = 'fetch';
          link.crossOrigin = 'anonymous';
        }
        link.href = warm[i];
        document.head.appendChild(link);
      }
    })();
  </script>

  <link rel="manifest" href="manifest.json">

  <!--
    Google tag (gtag.js) — the only third-party script on this page, and the
    only network call the app makes once it is running. There is still no tag
    manager and no font CDN: Poppins is bundled with the app.

    What is measured, and what is deliberately not, is written down in
    PRIVACY.md. Three things about this block are load-bearing:

      * Advertising is denied before the tag configures itself, so nothing
        here can become an ad audience. These are three- to five-year-olds.
        GA4 drops the IP address by default; there is no `anonymize_ip` to
        set on a GA4 property.
      * `send_page_view` is off. Silly Soup is one page whose URL never
        changes, so a tag-fired page view would count the sound picker once
        and the soup never. The app sends its own instead — see
        lib/services/analytics_route_observer.dart.
      * The app never sends anything a child typed, said or was filmed doing,
        because it never has any of it. See PRIVACY.md.
  -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DEQ5M9ZK36"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    // Before config, or it does not apply to the first hit.
    gtag('consent', 'default', {
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });

    gtag('js', new Date());
    gtag('config', 'G-DEQ5M9ZK36', {
      send_page_view: false,
      allow_google_signals: false,
      allow_ad_personalization_signals: false
    });
  </script>

  <style>
    html, body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: #FFF7EE;
    }

    /*
      The boot splash.
      Until this existed the app showed a bare cream rectangle for the whole
      engine download, then a *second* Flutter-drawn spinner while the sound
      bank loaded — so the first thing a nursery saw was several seconds of
      nothing. This paints with the HTML, needs no font, no image and no
      request, and hands over to the chef in one step.
    */
    .boot {
      position: fixed;
      inset: 0;
      z-index: 99997;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #FFF7EE;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      /* Fades out rather than snapping, so the handover is not a flash. */
      transition: opacity 260ms ease-out;
    }
    .boot[hidden] { display: none; }
    .boot.boot-done { opacity: 0; pointer-events: none; }
    .boot h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 600;
      color: #3C4759;
      letter-spacing: 0.5px;
    }
    .boot p { margin: 0; font-size: 17px; color: #6B7A99; }

    /* Pot and spoon, drawn rather than fetched. */
    .boot svg { width: 132px; height: 132px; }
    .boot .steam { animation: boot-steam 2.4s ease-in-out infinite; }
    .boot .steam-b { animation-delay: 0.5s; }
    .boot .steam-c { animation-delay: 1s; }
    .boot .spoon { transform-origin: 93.5px 64px; animation: boot-stir 2.6s ease-in-out infinite; }

    @keyframes boot-steam {
      0%   { opacity: 0; transform: translateY(4px); }
      40%  { opacity: 0.85; }
      100% { opacity: 0; transform: translateY(-12px); }
    }
    @keyframes boot-stir {
      0%, 100% { transform: rotate(-11deg); }
      50%      { transform: rotate(11deg); }
    }

    .boot-bar {
      width: 190px;
      height: 8px;
      border-radius: 4px;
      background: #F0E2D2;
      overflow: hidden;
    }
    .boot-bar i {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 4px;
      background: #FF7A45;
      animation: boot-slide 1.5s ease-in-out infinite;
    }
    @keyframes boot-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }

    /* A reduced-motion setting is a hard requirement here, splash included. */
    @media (prefers-reduced-motion: reduce) {
      .boot .steam, .boot .spoon, .boot-bar i { animation: none; }
      .boot .steam { opacity: 0.7; }
      .boot-bar i { width: 100%; }
      .boot { transition: none; }
    }

    /*
      The install hint sits at the TOP and lets taps through. At the bottom it
      covered the one button the child is meant to press, and on a phone in
      landscape that button is the whole game.
    */
    .install-banner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.82);
      color: white;
      padding: 10px 16px;
      padding-top: calc(10px + env(safe-area-inset-top));
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 99998;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
      transition: opacity 200ms ease;
    }
    .install-banner span { flex: 1; }
    @media (prefers-reduced-motion: reduce) {
      .install-banner { transition: none; }
    }
  </style>
  <script>
    // Fullscreen on the first tap, so a tablet in a classroom loses the
    // browser chrome. Nothing here talks to a server.
    var fullscreenRequested = false;
    function requestFullscreen() {
      if (fullscreenRequested) return;
      if (!/iPhone|iPad|Android/i.test(navigator.userAgent)) return;
      if (window.matchMedia('(display-mode: standalone)').matches) return;

      fullscreenRequested = true;
      var elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(function() {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
    }
    document.addEventListener('click', requestFullscreen, { once: true });
    document.addEventListener('touchstart', requestFullscreen, { once: true });

    // The hint shows once, gets out of the way by itself, and never waits
    // to be dismissed by a four-year-old who cannot read it.
    if (window.matchMedia('(display-mode: browser)').matches &&
        /iPhone|iPad|Android/i.test(navigator.userAgent)) {
      window.addEventListener('load', function() {
        if (localStorage.getItem('install-banner-dismissed')) return;
        setTimeout(function() {
          var banner = document.querySelector('.install-banner');
          if (!banner) return;
          banner.style.display = 'flex';
          setTimeout(dismissInstallBanner, 8000);
          document.addEventListener('pointerdown', dismissInstallBanner,
                                    { once: true });
        }, 3000);
      });
    }
    // Called from Dart once the sound bank and the adult's settings are in
    // and the first real frame has been painted — see
    // lib/services/boot_splash_web.dart. Defined here unconditionally so the
    // Dart side always has something to call.
    window.sillySoupBootSplashDone = function () {
      var boot = document.getElementById('boot-splash');
      if (!boot || boot.dataset.done) return;
      boot.dataset.done = '1';
      boot.classList.add('boot-done');
      var drop = function () { boot.hidden = true; };
      boot.addEventListener('transitionend', drop, { once: true });
      // transitionend never fires under prefers-reduced-motion.
      setTimeout(drop, 400);
    };

    function dismissInstallBanner() {
      var banner = document.querySelector('.install-banner');
      if (banner) banner.style.display = 'none';
      localStorage.setItem('install-banner-dismissed', 'true');
    }
  </script>
</head>
<body>
  <!-- Removed by dismissBootSplash() in lib/services/boot_splash_web.dart. -->

    <h1>Silly Soup</h1>

    <div class="boot-bar" aria-hidden="true"><i></i></div>
  </div>

  <!--
    No close button. It was the one part of the banner that took taps, and it
    sat in the top-right corner directly over the cog that opens the grown-ups'
    area — and over "stop the sound" in the kitchen — on every screen size. A
    grown-up holding the cog while the hint was up dismissed the hint instead,
    and the three-second hold never started. The hint already goes away on the
    first touch anywhere and after eight seconds, so nothing is lost.
  -->
  <div class="install-banner" aria-hidden="true">
    <span>Tap Share, then "Add to Home Screen"</span>
  </div>
