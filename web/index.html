  <!--
    Google tag (gtag.js) — the only third-party script on this page, and the
    only network call the app makes once it is running. There is still no tag
    manager and no font CDN: Poppins is bundled with the app.

    What is measured, and what is deliberately not, is written down in
    PRIVACY.md. Three things about this block are load-bearing:

      * Advertising is denied before the tag configures itself, so nothing
        here can become an ad audience. These are three- to five-year-olds.
        GA4 drops the IP address by default; there is no `anonymize_ip` to
        set on a GA4 property.
      * `send_page_view` is off. Silly Soup is one page whose URL never
        changes, so a tag-fired page view would count the sound picker once
        and the soup never. The app sends its own instead — see
        lib/services/analytics_route_observer.dart.
      * The app never sends anything a child typed, said or was filmed doing,
        because it never has any of it. See PRIVACY.md.
  -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DEQ5M9ZK36"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    // Before config, or it does not apply to the first hit.
    gtag('consent', 'default', {
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });

    gtag('js', new Date());
    gtag('config', 'G-DEQ5M9ZK36', {
      send_page_view: false,
      allow_google_signals: false,
      allow_ad_personalization_signals: false
    });
  </script>

  <style>
    html, body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: #FFF7EE;
    }

    /* Silly Soup is laid out for a tablet on a table, in landscape. */
    .rotate-prompt {
      display: none;
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #FF7A45 0%, #FFB03A 100%);
      color: white;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      text-align: center;
      padding: 32px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .rotate-prompt svg {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      animation: rotate-hint 2s ease-in-out infinite;
    }
    .rotate-prompt h2 { font-size: 24px; font-weight: 600; margin: 0 0 12px 0; }
    .rotate-prompt p { font-size: 16px; opacity: 0.9; margin: 0; max-width: 280px; }

    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-15deg); }
      75% { transform: rotate(15deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .rotate-prompt svg { animation: none; }
    }
    @media screen and (orientation: portrait) and (max-width: 900px) {
      .rotate-prompt { display: flex; }
    }

    .install-banner {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 12px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      z-index: 99998;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .install-banner span { flex: 1; }
    .install-banner button {
      background: transparent;
      color: white;
      border: none;
      padding: 8px;
      font-size: 18px;
      opacity: 0.7;
      cursor: pointer;
    }
  </style>
  <script>
    // Fullscreen on the first tap, so a tablet in a classroom loses the
    // browser chrome. Nothing here talks to a server.
    var fullscreenRequested = false;
    function requestFullscreen() {
      if (fullscreenRequested) return;
      if (!/iPhone|iPad|Android/i.test(navigator.userAgent)) return;
      if (window.matchMedia('(display-mode: standalone)').matches) return;

      fullscreenRequested = true;
      var elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(function() {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
    }
    document.addEventListener('click', requestFullscreen, { once: true });
    document.addEventListener('touchstart', requestFullscreen, { once: true });

    if (window.matchMedia('(display-mode: browser)').matches &&
        /iPhone|iPad|Android/i.test(navigator.userAgent)) {
      window.addEventListener('load', function() {
        if (localStorage.getItem('install-banner-dismissed')) return;
        setTimeout(function() {
          var banner = document.querySelector('.install-banner');
          if (banner) banner.style.display = 'flex';
        }, 3000);
      });
    }
    function dismissInstallBanner() {
      var banner = document.querySelector('.install-banner');
      if (banner) banner.style.display = 'none';
      localStorage.setItem('install-banner-dismissed', 'true');
    }
  </script>

    <h2>Please turn the tablet sideways</h2>

  <div class="install-banner">
    <span>For fullscreen, tap Share then "Add to Home Screen"</span>
    <button class="close-btn" onclick="dismissInstallBanner()" aria-label="Dismiss">✕</button>
