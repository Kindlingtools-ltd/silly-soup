  <!--
    No analytics, no tag manager, no font CDN, no third-party script of any
    kind. Poppins is bundled with the app. This page must not make a network
    call the app itself would not make — see PRIVACY.md.
  -->

  <style>
    html, body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: #FFF7EE;
    }

    /*
      The install hint sits at the TOP and lets taps through. At the bottom it
      covered the one button the child is meant to press, and on a phone in
      landscape that button is the whole game.
    */
    .install-banner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.82);
      color: white;
      padding: 10px 16px;
      padding-top: calc(10px + env(safe-area-inset-top));
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 99998;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
      transition: opacity 200ms ease;
    }
    .install-banner span { flex: 1; }
    .install-banner button {
      background: transparent;
      color: white;
      border: none;
      padding: 8px;
      font-size: 18px;
      opacity: 0.7;
      cursor: pointer;
      pointer-events: auto;
    }
    @media (prefers-reduced-motion: reduce) {
      .install-banner { transition: none; }
    }
  </style>
  <script>
    // Fullscreen on the first tap, so a tablet in a classroom loses the
    // browser chrome. Nothing here talks to a server.
    var fullscreenRequested = false;
    function requestFullscreen() {
      if (fullscreenRequested) return;
      if (!/iPhone|iPad|Android/i.test(navigator.userAgent)) return;
      if (window.matchMedia('(display-mode: standalone)').matches) return;

      fullscreenRequested = true;
      var elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(function() {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
    }
    document.addEventListener('click', requestFullscreen, { once: true });
    document.addEventListener('touchstart', requestFullscreen, { once: true });

    // The hint shows once, gets out of the way by itself, and never waits
    // to be dismissed by a four-year-old who cannot read it.
    if (window.matchMedia('(display-mode: browser)').matches &&
        /iPhone|iPad|Android/i.test(navigator.userAgent)) {
      window.addEventListener('load', function() {
        if (localStorage.getItem('install-banner-dismissed')) return;
        setTimeout(function() {
          var banner = document.querySelector('.install-banner');
          if (!banner) return;
          banner.style.display = 'flex';
          setTimeout(dismissInstallBanner, 8000);
          document.addEventListener('pointerdown', dismissInstallBanner,
                                    { once: true });
        }, 3000);
      });
    }
    function dismissInstallBanner() {
      var banner = document.querySelector('.install-banner');
      if (banner) banner.style.display = 'none';
      localStorage.setItem('install-banner-dismissed', 'true');
    }
  </script>

<body>
  <div class="install-banner">
    <span>Tap Share, then "Add to Home Screen"</span>
    <button class="close-btn" onclick="dismissInstallBanner()" aria-label="Dismiss">✕</button>
  </div>
